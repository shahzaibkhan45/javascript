<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur check karo ke uska last digit even hai ya odd.</title>
</head>
<body>
    <script>
    let number = prompt("write a number");

    lastDigit = number % 10;

    if(lastDigit % 2 === 0){
     console.log("it is even")
    }else{
      console.log("its is Odd");
    }

    // console.log(lastDigit);
    </script>
</body>
