<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is array mein 7 kitni baar aaya hai, find karo.</title>
</head>
<body>
    <script>
        let numbers = [4, 7, 2, 9, 7, 4, 7,7,7,7];
        let sumOfSeven = 0;
        for(let i = 0; i < numbers.length ; i++){
            if(numbers[i] === 7){
             sumOfSeven++;
            }

        }
        console.log(sumOfSeven);
    </script>
</body>
</html>
