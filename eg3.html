<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Number with user check it was disible by 10 and 5</title>
</head>
<body>
    <script>
        let number = Number(prompt("write a number"));


            if (number % 3 === 0 || number % 7 === 0) {
                document.write("this number is divisible by 3 or 7 ")
            } else {
                document.write("this number is not divisible by 7 and 3")
            }

    </script>
</body>
</html>
