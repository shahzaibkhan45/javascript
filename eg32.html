<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is array mein se second largest number find karo.</title>
</head>
<body>
    <script>
        let numbers = [10, 25, 7, 42, 18, 31];
        let largestNum = numbers[0];
        let seclargestNum = numbers[0];

        for(let i = 0; i < numbers.length ; i++){
            if(largestNum < numbers[i]){
                seclargestNum = largestNum;
              largestNum = numbers[i];
            }else if(seclargestNum < numbers[i]){
                seclargestNum = numbers[i];
            }
        }
        console.log(seclargestNum);
    </script>
</body>
</html>
