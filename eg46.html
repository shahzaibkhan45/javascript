<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array mein do missing numbers find karo.</title>
</head>
<body>
    <script>
        
        let number = [1, 2, 4, 6, 7, 9 , 3 , 5];
        
        let numbers = number.sort((a, b) => a - b);
        
        let lastNumber = numbers[numbers.length - 1];

        for(let i = 1; i < lastNumber ; i++){
         let found = false;

         for(let j = 0 ; j < numbers.length ; j++){
            if(numbers[j] === i){
                found = true;
                break;
            }
        }

            if(found === false){
             console.log("The missing Number is "+ i )
            }
        }

        

    </script>
</body>
</html>
