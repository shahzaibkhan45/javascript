<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check whether a number is Strong Number or not.</title>
</head>
<body>
    <script>
        let num = 145;
        let copy = num;
        let fact = 0;
        let count = num.toString().length;
        for(let i = 0; i < count; i++){
            let last = num % 10;
            let factorial = 1;
            
            for(let j = last ; j > 0 ; j--){
               factorial *= j;

            }
            fact += factorial;
            num = Math.floor(num / 10);

        }
        if(copy === fact){
            console.log("yes");
        }else{
            console.log("not");
        }
    </script>
</body>
</html>
