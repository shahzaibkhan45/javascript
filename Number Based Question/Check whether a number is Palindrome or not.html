<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check whether a number is Palindrome or not.</title>
</head>
<body>
    <script>
        let num = 121;
        let copy = num;
        let count = num.toString().length;
        let reverseNum = "";

        for(let i = 0 ; i < count; i++){
            let last = num % 10;
            // last.toString();
            reverseNum += last;
            num = Math.floor(num / 10);
        }
        if(copy == reverseNum){
            console.log("the number is Plaindrome")
        }else{
             console.log("the number is not Plaindrome")
        }



    </script>
</body>
</html>
