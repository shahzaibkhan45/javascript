<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Factorial of a number.</title>
</head>
<body>
    <script>
        let num = 5;
        let factorial = 1;
        for(let i = num ; i > 0; i--){
            factorial *= i ;
       
        }
        console.log(factorial);

    </script>
</body>
</html>
