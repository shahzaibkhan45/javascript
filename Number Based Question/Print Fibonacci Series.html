<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Fibonacci Series.</title>
</head>
<body>
    <script>
        let num = 6;
        let FirSec = [0,1];
        let fibionci = [0,1];
        if(num <= 0){
            console.log([])
        }else if(num === 1){
            console.log([0]);
        }else if(num === 2){
            console.log(FirSec);
        }else{
            for(let i = 0; i < num - 2 ; i++){
                let number = fibionci[i] + fibionci[i + 1];
                fibionci.push(number);


            }
            console.log(fibionci)
        }
        

    </script>
</body>
</html>
