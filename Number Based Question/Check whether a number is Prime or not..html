<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check whether a number is Prime or not.</title>
</head>
<body>
    <script>
        let num = 7 ;
        let check = true;

        if(num === 2){
           check = true;
        }else if(num <= 1 || num % 2 === 0){
            check = false;
        }else{

            for(let i = 3; i <= Math.sqrt(num); i++){
                if(num % i === 0){
                 check = false;
                 break;
                }
            }


        }
        if(check){
            console.log("the Num is prime Number");
        }else{
             console.log("the Num is not a prime Number");
        }


    </script>
</body>
</html>
