<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Negative or Zero checking</title>
</head>
<body>
    <script>
    let number = Number(prompt("write a number"));
    if(number === 0){
    document.write("Zero")
    }else if(number < 0){
     document.write("negative number")
    }else{
        document.write("positive number") 
    }
    </script>
</body>
</html>
