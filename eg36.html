<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is array mein sabhi numbers ka average find karo.</title>
</head>
<body>
    <script>
        let numbers = [12, 5, 8, 20, 3, 15];
        sum = 0;

        for(let i = 0; i < numbers.length ; i++){
           sum += numbers[i];
        }

        let average = sum / numbers.length;
        console.log(average);
    </script>
</body>
</html>
