<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur check karo ke woh Perfect Number hai ya nahi.</title>
</head>
<body>
   <script>

    let number = Number(prompt("write a single number"));

    let sum = 0
    
    for(let i = 1 ; i < Math.sqrt(number); i++){

        if (number % i === 0){
          sum += i
        }
     
    }
    if(number === sum){
        console.log("yes")
    }else{
        console.log("no")
    }
   </script> 
</body>
</html>
