<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur us number ke andar 5 digit kitni baar aayi hai, count karo.</title>
</head>
<body>
    <script>
         let number = Number(prompt("write a number"));
         let count = 0;
         while(number > 0){
         let lastDigit = number % 10;
         if(lastDigit === 5){
          count++;
         }
         number = Math.floor(number / 10);
         }
         console.log(count);
    </script>
</body>
</html>
