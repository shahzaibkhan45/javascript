<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Is array mein jo numbers duplicate hain, unko find karo.


    </title>
</head>

<body>
    <script>
        let numbers = [4, 7, 2, 9, 7, 4, 7, 2,9];
        let duplicateNumbers = [];
        
        for(let i = 0 ; i < numbers.length ; i++){
            for(let j = i + 1 ; j < numbers.length ; j++){
                let found = false;
                if(numbers[i] === numbers[j]){

                     for(let k = 0; k < duplicateNumbers.length ; k++){

                    if(numbers[i] === duplicateNumbers[k]){
                        found = true;
                        break;
                     
                    }
                }
                
                if(found === false){
                    duplicateNumbers.push(numbers[i]);
                }
                }
            }
           
            
        }
        console.log(duplicateNumbers);


    </script>
</body>

</html>
