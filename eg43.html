<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Is array mein jo numbers duplicate hain, unko find karo.


    </title>
</head>

<body>
    <script>
        let numbers = [4, 7, 2, 9, 7, 4, 7, 2];

        let duplicateNumber = [];

        for (let i = 0; i < numbers.length; i++) {
            for (let j = i + 1; j < numbers.length; j++) {
                if (numbers[i] === numbers[j]) {
                    let alreadyExist = false;
                    if (duplicateNumber.length !== 0) {
                        for (let k = 0; k < duplicateNumber.length; k++) {
                            if (duplicateNumber[k] === numbers[i])
                                alreadyExist = true;
                            break;

                        }
                    } else {
                        duplicateNumber.push(numbers[i]);
                    }

                    if (!alreadyExist) {
                        duplicateNumber.push(numbers[i]);
                    }
                }
            }

        }
        console.log(duplicateNumber);

    </script>
</body>

</html>
