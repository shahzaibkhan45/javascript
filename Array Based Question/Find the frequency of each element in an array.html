<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the frequency of each element in an array.

</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5,1,2,3,4,4,4,5,3,,3,7,6,9];
        let obj = {};
         for(let i = 0 ; i < arr.length; i++ ){
            if(obj[arr[i]]){
                obj[arr[i]]++;
            }else{
                obj[arr[i]] = 1;
            }
            
        }
        console.log(obj);

    </script>
</body>
</html>
