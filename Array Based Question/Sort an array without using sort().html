<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort an array without using sort().</title>
</head>
<body>
    <script>
          let arr = [5,3,2,1,4,1];
           for(let i = 0 ; i < arr.length; i++ ){
             for(let j = i + 1 ; j < arr.length; j++ ){
                // 5         3
            if(arr[i] > arr[j] && i !== j){
                let temp = arr[j];
                arr[j] = arr[i]; 
                arr[i] = temp; 
               
                //[3,2,1,4,1,5]


            }
        }
        //  console.log(arr)
        }
        console.log(arr);
    </script>
</body>
</html>
