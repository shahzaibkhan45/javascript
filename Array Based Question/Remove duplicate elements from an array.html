<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove duplicate elements from an array.</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5,3,4,10,20,80,3,2,1];
        let newArr = []

        for(let i = 0; i < arr.length ; i++){
            let exist = false;
            for(let j = 0 ; j < newArr.length; j++){
               if(arr[i] === newArr[j]){
                exist = true;
                break;
               }
            }
            if(exist === false){
                newArr.push(arr[i]);
            }
        }
        console.log(newArr);
    </script>
</body>
</html>
