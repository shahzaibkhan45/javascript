<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur check karo ke woh 3 se divisible hai lekin 5 se divisible nahi hai.</title>
</head>
<body>
    <script>
     let number = Number(prompt("write a number"));

     if(!(number % 5 === 0) && number % 3 === 0){
       document.write("The number is even or positive");
     }else{
         document.write("The number is not")
     }

    </script>
</body>
</html>
