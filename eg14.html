<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do numbers lo aur check karo ke dono mein se koi ek number 10 se greater hai.</title>
</head>
<body>
    <script>
     let number1 = Number(prompt("write a number"));
     let number2 = Number(prompt("write a number"));

     if(number1 > 10 || number2 > 10){
       document.write("yes");
     }else{
         document.write("The number is not")
     }

    </script>
</body>
</html>
