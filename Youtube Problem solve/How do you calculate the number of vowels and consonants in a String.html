<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"How do you calculate the number of vowels and consonants in a String?"</title>
</head>
<body>
    <script>
        let name = "shahzaib";
        let vowel = "aeiou";
        let vowelCount = 0;
        let constantCount = 0;
        for(let i = 0; i < name.length ; i++){
            let exist = false;
           for(let j = 0; j < vowel.length ; j++){
            if(name[i] !== vowel[j]){
                // count++;
                exist = false;
            }else{
                exist = true;

            }
           }
           if(exist){
             constantCount++;
           }else{
             vowelCount++;
           }
        }
        console.log("this vowel in sting is"+ vowelCount + "and" + constantCount);
    </script>
</body>
</html>
