<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a JavaScript program to find the number of occurrences of a particular character in a string.</title>
</head>

<body>
    <script>
        let str = "shahzaib";
        let char = "a";
        let count = 0;

        for(let i = 0; i < str.length ; i++){
            if(str[i] === char){
                count++;
            }
        }

        console.log(count);
        
    </script>
</body>

</html>
