<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How do you remove all occurrences of a given character from the input string</title>
</head>

<body>
    <script>
        let str = "javascript";
        let char = "a";
        let newStr = "";

        for(let i = 0; i < str.length ; i++){
            if(str[i] !== char){
                // newStr.push(str[i]);
                newStr += str[i];
            }
        }
    
        // console.log(newStr.join(""));
        console.log(newStr)
    </script>

</body>

</html>
