<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How do you reverse an array</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5,6,4,5,4,6,9];
        let reverse = [];
        for(let i = arr.length - 1 ; i >= 0 ; i--){

            reverse.push(arr[i]);
                  }
                  console.log(reverse);
    </script>
</body>
</html>
