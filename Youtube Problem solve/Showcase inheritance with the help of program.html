<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase inheritance with the help of program</title>
</head>
<body>
    <script>
        class Animal{
        Eating(){
            console.log("animal is eating");

         }

        }
        class Dog extends Animal{
            Barking(){
                  console.log("Dog is Barking");
            }
        }

        let a1 = new Dog();
        a1.Eating();
        a1.Barking()
    </script>
</body>
</html>
