<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How do you sum all the Element in an array</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5,67,89];
        let sum = 0;

        for(let i = 0; i < arr.length ; i++){
           sum += arr[i];
        }
        console.log(sum);
    </script>
</body>
</html>
