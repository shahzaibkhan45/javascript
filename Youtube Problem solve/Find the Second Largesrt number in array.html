    <script>
        let arr = [1,2,3,4,5,67,4,5,6,89];
        let largest = arr[0];
        let second = arr[0];
        for(let i = 0 ; i < arr.length ; i++){
           
                if(arr[i] >  largest){
                    second = largest
                    largest = arr[i];

                }else if(arr[i] > second){
                  second = largest;
                }


        }
        console.log(second);

    </script>
