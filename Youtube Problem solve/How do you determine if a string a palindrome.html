<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How do you determine if a string a palindrome</title>
</head>
<body>
    <script>
        let name = "";
        let reverse = "";
        for(let i = name.length - 1 ; i >= 0 ; i--){
            reverse += name[i];
        }

        if(name === reverse){
            console.log("the string is palindrome")
        }else{
             console.log("the string is not palindrome")
        }
    </script>
</body>
</html>
