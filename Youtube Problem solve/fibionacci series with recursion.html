<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibionacci Series with recursion</title>
</head>
<body>
    <script>
        let n = 9;
        let arr = [];
        function Fibionacci(n){
            if(n <= 1){
                return n;
            }
            return Fibionacci(n - 1) + Fibionacci(n - 2);
        }
        for(let i = 0; i < n ; i++){
            // console.log(Fibionacci(i));
            arr.push(Fibionacci(i));
        }
        console.log(arr);


    </script>
</body>
</html>
