<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if the given number is prime</title>
</head>
<body>
    <script>
        let num = 5;
        let check = true;

        if(num === 1 || num <= 0 || num % 2 === 0 && num !== 2){
            check = false;
        }else if(num === 2){
            check = true;
        }else if(num % 2 !== 0){
            for(let i = 2; i <= Math.floor(Math.sqrt(num)) ; i++){
                if(num % i === 0){
                    check = false;
                }
            }
        }
        console.log(check);
    </script>
</body>
</html>
