    <script>
        let n = 5;
        function FibionciSeries(n){
            let series = [0,1];
            if(n !== 0 && n !== 1){
                for(let i = 1 ; i < n - 1 ; i++){
                   series[i + 1] = series[i] + series[i - 1];
                }
                return series;

            }else if(n === 1){
                return [0]

            }else if(n === 0){
                return [];
            }

        }
        console.log(FibionciSeries(n));
    </script>
