<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is array mein sabse pehle aane wala even number find karo.</title>
</head>
<body>
    <script>
        let numbers = [12, 5, 8, 20, 3, 15];
        let firstEvenValue = 0;
        for(let i = 0 ; i < numbers.length ; i++){
         if(numbers[i] % 2 === 0){
            firstEvenValue = numbers[i];
            break;
         }
        }
        console.log(firstEvenValue);
    </script>
</body>
</html>
