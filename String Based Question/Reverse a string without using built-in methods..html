<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a string without using built-in methods.</title>
</head>
<body>
    <script>
        let name = "shahzaib";
        let reverse = "";
        for(let i = name.length - 1; i >= 0; i--){
            reverse += name[i];

        }
        console.log(reverse);
    </script>
</body>
</html>
