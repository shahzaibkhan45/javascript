<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check whether a string is Palindrome or not.</title>
</head>
<body>
    <script>
        let name = "shah";
        let reverse = "";

        for(let i = name.length - 1; i >= 0; i--){
        reverse += name[i];
        }
        if(name === reverse){
            console.log("Plaindrome")

        }else{
              console.log("Not Plaindrome")

        }
    </script>
</body>
</html>
