<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a JavaScript program to find duplicate elements in an array using loops.</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5,5,3,3,2,2,4,5,6,7,7,78,8,80,0,0,5,4,5,6,7,8];
        let duplicateElem = [];

        for(let i = 0 ; i < arr.length ; i++){
            for(let j = i + 1 ; j < arr.length ; j++){
                if(arr[i] === arr[j]){
                    let found = false;

                    for(let k = 0 ; k < duplicateElem.length ; k++){
                        if(arr[i] === duplicateElem[k]){
                            found = true;
                            break;
                        }


                    }
                    if(found === false){
                   //  arr[i].push(duplicateElem);
                     duplicateElem.push(arr[i]);
                    }
                }
            }
        }

        console.log(duplicateElem);
        console.log("hello")
    </script>
</body>
</html>
