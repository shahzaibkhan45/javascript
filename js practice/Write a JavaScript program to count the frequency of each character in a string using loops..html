     let str = "shahzaib";
     let checked = [];
     

     for(let i = 0; i < str.length ; i++){

        let exist = false;
        for(let j = 0; j < checked.length ; j++){
            if(str[i] === checked[j]){
                exist = true;
                break;
            }
        }
        if(exist === false){
            let count = 0;
            for(let k = 0; k < str.length ; k++){
                if(str[i] === str[k]){
                    count++;
                }
            }
            checked.push(str[i]);
          console.log(str[i] +"="+ count)  
          
        }
     }
