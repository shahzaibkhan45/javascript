<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take a number to print the table</title>
</head>
<body>
    <script>
        let number = Number(prompt("number"));
        for(let i = 1; i <= 10 ; i++){
            console.log(number * i);

        }
    </script>
</body>
</html>
