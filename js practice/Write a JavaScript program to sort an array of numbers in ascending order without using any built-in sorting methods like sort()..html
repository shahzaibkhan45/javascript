<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a JavaScript program to sort an array of numbers in ascending order without using any built-in sorting methods like sort().</title>
</head>
<body>
    <script>
        let arr = [5, 2, 8, 1, 9, 3,1,2];

        for(let i = 0; i < arr.length ; i++){
            for(let j = 0; j < arr.length - 1 - i; j++){
             if(arr[j] > arr[j + 1]){
                let temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
             }
            }
        }
        console.log(arr);
        
    </script>
    
</body>
</html>
