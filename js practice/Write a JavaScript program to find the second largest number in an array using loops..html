    <title>Write a JavaScript program to find the second largest number in an array using loops.</title>
</head>
<body>
    <script>
        let arr = [10, 5, 20, 8, 15, 25, 12, 66,66,65,67, 67];
         let largest = arr[0];
         let secondlar = arr[0];
        for(let i = 0 ; i < arr.length ; i++){
         if(largest < arr[i]){
            secondlar = largest;
            largest = arr[i];

         }else if(secondlar < arr[i] && largest > arr[i]){
            secondlar = arr[i];

         }

        }
        console.log(secondlar)

    </script>
</body>
