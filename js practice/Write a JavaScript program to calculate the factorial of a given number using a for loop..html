<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a JavaScript program to calculate the factorial of a given number using a for loop.</title>
</head>
<body>
    <script>
        let num = Number(prompt("write a number to find a factorial !"))
        let factorialNum = 1;

        for(let i = num ; i > 0 ; i--){
         factorialNum *= i;
            

        }
        console.log(factorialNum);
    </script>
</body>
</html>
