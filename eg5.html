<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur check karo ke woh even hai ya 5 se divisible hai.</title>
</head>
<body>
    <script>
     let number = Number(prompt("write a number"));

     if(number % 5 === 0 || number % 2 === 0){
       document.write("The number is even hai ya 5 se divisible hai")
     }else{
         document.write("The number is not")
     }

    </script>
</body>
</html>
