<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur us number ke sabhi digits ko reverse karo.</title>
</head>
<body>
    <script>
        let number = Number(prompt("write a number"));
        let reverseNumber = ""; 
        while(number > 0){
         let lastDigit = number % 10;
         lastDigit = String(lastDigit);
         reverseNumber += lastDigit;

         number = Math.floor(number / 10);
        }
        console.log(reverseNumber);
    </script>
</body>
</html>
