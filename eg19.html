    <title>Ek number lo aur count karo ke us number mein total kitne digits hain.</title>
</head>
<body>
    <script>
        let number = Number(prompt("write a number"));

        let count = 0;

        while(number > 0){
            let lastDigit = number % 10;
             count++;
            number = Math.floor(number / 10);
        }
        console.log(count);
    </script>
