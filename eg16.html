<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur uske digits ka sum find karo.</title>
</head>
<body>
    <script>
    let number = Number(prompt("write a number to find its sum"));
    let sum = 0;

    
    while(number > 0){
        let lastDigit = number % 10;

        sum += lastDigit;

        number = Math.floor(number / 10);
    }
    console.log(sum);
    
    </script>
</body>
</html>
