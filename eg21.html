<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ek number lo aur 
check karo ke us number mein 0 kitni baar aaya hai.</title>
</head>
<body>
    <script>
        let number = Number(prompt("write a number"));//agar 090 aise likhe gy to number 90 hogaiega pahle wae 0 ko remove karedega
        let countOfZero = 0;
        while(number > 0){
        let lastDigit = number % 10;
        if(lastDigit === 0){
            countOfZero++;
        }
        number = Math.floor(number / 10);
        }
        console.log(countOfZero);
    </script>
</body>
</html>
