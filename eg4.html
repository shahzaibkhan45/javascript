<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take number with user check it woh even hai or 10 se greater hone chahye</title>
</head>
<body>
    <script>
        let number = Number(prompt("Write Number to check is even and greater then 10"));

        if(number > 10 && number % 2 === 0){
         document.write("the number is even and greater than 10");
        }else{
            document.write("Number is not");
        }
    </script>
</body>
</html>
